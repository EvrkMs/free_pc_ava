# Перед первым запуском:
#   1. положить сертификат в ./secrets/langame.p12
#   2. заполнить .env (см. .env.example): LANGAME_LOGIN, LANGAME_PASSWORD,
#      LANGAME_PFX_PASSPHRASE
#
#   docker compose build
#   docker compose run --rm langame-status node login.js   # первый вход, интерактивно
#   docker compose up -d

services:
  langame-status:
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
    build:
      context: .
      dockerfile: Dockerfile
    image: free-pc-ava
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # Сессия (.session/cookies.json) переживает пересоздание контейнера,
      # чтобы не логиниться заново на каждый деплой.
      - session-data:/app/.session
    restart: unless-stopped
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?токен туннеля из Zero Trust dashboard}
    depends_on: [langame-status]
    restart: unless-stopped
    networks: [internal]
    
volumes:
  session-data:

networks:
  internal:
